server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # single-page app: route everything back to index.html so client-side
    # routes (e.g. /agendamento/:token) work on a direct visit or refresh
    location / {
        try_files $uri $uri/ /index.html;
    }

    # let the browser cache hashed assets aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
